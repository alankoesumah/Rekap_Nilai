<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Nilai SDNP Tunas Global</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans for clean minimalist typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    @keyframes fadeInSmooth {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeInSmooth 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.25s; }
    .delay-3 { animation-delay: 0.4s; }

    /* Converts PNG logo graphics into an elegant rich purple color (#7c3aed) */
    .purple-logo {
      filter: brightness(0) saturate(100%) invert(28%) sepia(85%) saturate(2388%) hue-rotate(254deg) brightness(91%) contrast(95%);
    }

    /* Elegant Light Minimalist Card Styling */
    .minimal-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 4px 20px -2px rgba(124, 58, 237, 0.04);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .minimal-card:hover {
      background: #ffffff;
      border-color: rgba(192, 132, 252, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px -6px rgba(124, 58, 237, 0.12);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between items-center relative overflow-x-hidden selection:bg-purple-200 selection:text-purple-900">

  <!-- Subtle ambient purple background glow -->
  <div class="fixed top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-purple-200/40 rounded-full blur-[140px] pointer-events-none"></div>

  <!-- Main Content Container -->
  <main class="w-full max-w-md px-6 py-12 m-auto relative z-10 flex flex-col items-center">
    
    <!-- Logo & Header -->
    <div class="animate-fade-in opacity-0 mb-8 text-center flex flex-col items-center">
      <!-- School Logo Container with Purple Filter -->
      <div class="w-24 h-24 mb-5 p-3 rounded-2xl bg-purple-50/80 border border-purple-100 shadow-xl shadow-purple-500/10 flex items-center justify-center backdrop-blur-md group transition-transform duration-300 hover:scale-105">
        <img 
          src="https://i.imgur.com/5T1LlRI.png" 
          alt="Logo SDNP Tunas Global" 
          class="w-full h-full object-contain purple-logo"
          onerror="this.onerror=null; this.src='https://placehold.co/96x96/f3e8ff/7c3aed?text=SDNP';"
        />
      </div>
      
      <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900 mb-2">
        Rekap Nilai SDNP Tunas Global
      </h1>
      <p class="text-slate-500 text-xs sm:text-sm leading-relaxed max-w-xs mx-auto">
        Akses dokumen rekapitulasi nilai Google Spreadsheet resmi di bawah ini.
      </p>
    </div>

    <!-- Link Cards Stack -->
    <div class="w-full space-y-3.5">

      <!-- Link 1: Rekap Nilai SH -->
      <a 
        href="https://docs.google.com/spreadsheets/u/3/d/1_uUWbfN-au1AXQAnof02hdiLdlXtboPf/edit?usp=drivesdk&ouid=112508512639491852927&rtpof=true&sd=true" 
        target="_blank" 
        rel="noopener noreferrer"
        class="animate-fade-in delay-1 opacity-0 group minimal-card relative flex items-center justify-between p-4 sm:p-4.5 rounded-xl active:scale-[0.98]"
      >
        <div class="flex items-center space-x-3.5">
          <div class="p-2.5 rounded-xl bg-purple-100/70 text-purple-700 border border-purple-200/60 group-hover:bg-purple-600 group-hover:text-white transition-colors duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
              <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
              <path d="M8 13h8"/>
              <path d="M8 17h8"/>
            </svg>
          </div>
          <div>
            <h2 class="font-semibold text-sm sm:text-base text-slate-800 group-hover:text-purple-700 transition-colors">
              Rekap Nilai SH
            </h2>
            <p class="text-[11px] text-slate-400 mt-0.5">Google Sheets • Akses Langsung</p>
          </div>
        </div>
        
        <div class="text-slate-400 group-hover:text-purple-600 group-hover:translate-x-1 transition-all duration-300">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/>
            <path d="m12 5 7 7-7 7"/>
          </svg>
        </div>
      </a>

      <!-- Link 2: Rekap Nilai Kokurikuler Semester 1 -->
      <a 
        href="https://docs.google.com/spreadsheets/d/17rgC2awXqzJjfsssM-Bv8BxVST49_cm_/edit?usp=drivesdk&ouid=112508512639491852927&rtpof=true&sd=true" 
        target="_blank" 
        rel="noopener noreferrer"
        class="animate-fade-in delay-2 opacity-0 group minimal-card relative flex items-center justify-between p-4 sm:p-4.5 rounded-xl active:scale-[0.98]"
      >
        <div class="flex items-center space-x-3.5">
          <div class="p-2.5 rounded-xl bg-fuchsia-100/70 text-fuchsia-700 border border-fuchsia-200/60 group-hover:bg-fuchsia-600 group-hover:text-white transition-colors duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </div>
          <div>
            <h2 class="font-semibold text-sm sm:text-base text-slate-800 group-hover:text-purple-700 transition-colors">
              Rekap Kokurikuler
            </h2>
            <p class="text-[11px] text-slate-400 mt-0.5">Semester 1 • Google Sheets</p>
          </div>
        </div>

        <div class="text-slate-400 group-hover:text-purple-600 group-hover:translate-x-1 transition-all duration-300">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/>
            <path d="m12 5 7 7-7 7"/>
          </svg>
        </div>
      </a>

    </div>

    <!-- Share / Copy Link Button -->
    <div class="animate-fade-in delay-3 opacity-0 mt-8 text-center w-full">
      <button 
        id="copyBtn"
        onclick="copyPageUrl()" 
        class="inline-flex items-center gap-2 px-4 py-2 text-xs font-medium text-slate-600 hover:text-purple-700 bg-white hover:bg-purple-50/80 border border-slate-200 hover:border-purple-200 rounded-full shadow-sm transition-all duration-200 active:scale-95"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
          <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
        </svg>
        <span>Bagikan Tautan Halaman</span>
      </button>
    </div>

  </main>

  <!-- Footer -->
  <footer class="w-full py-6 text-center text-[11px] text-slate-400 relative z-10">
    <p>&copy; SDNP Tunas Global • Portal Rekap Nilai</p>
  </footer>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-slate-100 border border-slate-800 text-xs font-medium px-4 py-2 rounded-full shadow-2xl opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center gap-2">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-purple-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    <span>Tautan berhasil disalin!</span>
  </div>

  <script>
    function copyPageUrl() {
      const dummy = document.createElement('input');
      document.body.appendChild(dummy);
      dummy.value = window.location.href;
      dummy.select();
      document.execCommand('copy');
      document.body.removeChild(dummy);

      const toast = document.getElementById('toast');
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2200);
    }
  </script>
</body>
</html>
